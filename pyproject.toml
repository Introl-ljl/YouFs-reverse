[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youfs"
version = "0.1.0"
description = "Third-party BLE client for YouFs / Yongfengshun e-scooters (Tuya BLE protocol)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.21"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
